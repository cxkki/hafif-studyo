name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx neu update
      - run: node tools/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: HafifStudyo-windows
          path: |
            dist/HafifStudyo.exe
            dist/hs-run.ps1
            dist/TARIF.md
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HafifStudyo.exe
            dist/hs-run.ps1
            dist/TARIF.md
          generate_release_notes: true
